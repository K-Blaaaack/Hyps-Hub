name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # 先安装依赖（含 git），确保 checkout 创建真正的 .git，供 git archive 使用
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base qt6-declarative qt6-svg

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare builder
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder

      - name: Build package and release assets
        run: |
          set -euo pipefail
          pkgver="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD | head -n1)"
          if [ "v${pkgver}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 PKGBUILD pkgver=${pkgver} 不一致" >&2
            exit 1
          fi

          git archive --prefix="hyps-hub-${pkgver}/" \
            -o "hyps-hub-${pkgver}.tar.gz" HEAD
          srcsum="$(sha256sum "hyps-hub-${pkgver}.tar.gz" | cut -d' ' -f1)"

          mkdir -p pkgbuild dist
          cp packaging/PKGBUILD "hyps-hub-${pkgver}.tar.gz" pkgbuild/
          # 发布包必须校验源码 tar；本地 PKGBUILD 的 SKIP 只用于开发构建。
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${srcsum}')/" pkgbuild/PKGBUILD
          chown -R builder pkgbuild

          # git archive 不含 .git，显式把 tag 对应提交传给 CMake。
          commit="${GITHUB_SHA:0:12}"
          su builder -s /bin/bash -c \
            "cd '$PWD/pkgbuild' && HYPS_HUB_GIT_COMMIT='${commit}' makepkg -f --noconfirm"

          cp "pkgbuild/hyps-hub-${pkgver}-1-x86_64.pkg.tar.zst" dist/
          cp "hyps-hub-${pkgver}.tar.gz" dist/
          (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要 CHANGELOG.md 来生成正文
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      # Release 正文取自 CHANGELOG.md 里本版本的段落，而不是 GitHub 自动生成的
      # commit 列表——后者对使用者没有信息量。缺段落就让这一步失败。
      - name: Build release notes from CHANGELOG
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$ver" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 缺少 ${ver} 的段落，先补记录再发版。" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "**完整变更记录**：[CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
            echo "· **安装说明**：[docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md)"
          } >> release-notes.md
          echo "正文 $(wc -l < release-notes.md) 行："
          head -n 8 release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
